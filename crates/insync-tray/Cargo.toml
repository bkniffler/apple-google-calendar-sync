[package]
name = "insync-tray"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "insync-tray"
path = "src/main.rs"

[dependencies]
insync-config = { path = "../insync-config" }
insync-db = { path = "../insync-db" }
insync-engine = { path = "../insync-engine" }
chrono.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# default-features disabled to drop the `libxdo` feature, whose system
# `libxdo` (X11 cursor positioning) is not always installed on Linux build
# hosts. The tray and native menus work without it.
tray-icon = { version = "0.19", default-features = false }
tao = "0.30"
