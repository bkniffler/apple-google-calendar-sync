name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            exe: ""
            archive: tar.gz
          - label: macos-aarch64
            os: macos-latest
            exe: ""
            archive: tar.gz
          - label: windows-x86_64
            os: windows-latest
            exe: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tray links GTK3 and the AppIndicator library on Linux; the CLI
      # does not, so these are only needed for the tray binary.
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build
        run: cargo build --release --locked -p insync-cli -p insync-tray

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/insync${{ matrix.exe }}" dist/
          cp "target/release/insync-tray${{ matrix.exe }}" dist/
          tar -C dist -czf "insync-${{ matrix.label }}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/insync${{ matrix.exe }}" dist/
          Copy-Item "target/release/insync-tray${{ matrix.exe }}" dist/
          Compress-Archive -Path dist/* -DestinationPath "insync-${{ matrix.label }}.zip"

      # Import the Developer ID Application certificate into a throwaway
      # keychain so `codesign` can produce a real, notarizable signature.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Allow codesign to use the imported key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make the signing keychain searchable, keeping the login keychain too.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # Bundle the tray as a proper menu-bar .app (LSUIElement, no Dock icon)
      # and ship it in a drag-to-install .dmg. Both binaries live in
      # Contents/MacOS so the tray finds the `insync` CLI as a sibling.
      # The app and dmg are signed with Developer ID, notarized, and stapled.
      - name: Package macOS .app + .dmg
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in v*|"" | *[!0-9.]*) VERSION="0.0.0" ;; esac

          # PNG -> .icns
          mkdir -p icon.iconset
          SRC=crates/insync-tray/assets/icon.png
          sips -z 16 16     "$SRC" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "$SRC" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "$SRC" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "$SRC" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "$SRC" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "$SRC" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "$SRC" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "$SRC" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "$SRC" --out icon.iconset/icon_512x512.png
          cp "$SRC"         icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o insync.icns

          APP="insync.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/insync target/release/insync-tray "$APP/Contents/MacOS/"
          cp insync.icns "$APP/Contents/Resources/"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>insync</string>' \
            '  <key>CFBundleDisplayName</key><string>insync</string>' \
            '  <key>CFBundleIdentifier</key><string>com.bkniffler.insync</string>' \
            "  <key>CFBundleVersion</key><string>${VERSION}</string>" \
            "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            '  <key>CFBundleExecutable</key><string>insync-tray</string>' \
            '  <key>CFBundleIconFile</key><string>insync.icns</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '  <key>LSUIElement</key><true/>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' \
            > "$APP/Contents/Info.plist"

          # Sign with Developer ID + hardened runtime (required for notarization).
          # Sign the nested executables first, then the bundle as a whole.
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" \
            "$APP/Contents/MacOS/insync" \
            "$APP/Contents/MacOS/insync-tray"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # Notarize the app, then staple the ticket so it validates offline.
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "insync-app.zip"
          xcrun notarytool submit "insync-app.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

          # Build the drag-to-install disk image from the stapled app.
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "insync" -srcfolder dmgroot -ov -format UDZO \
            "insync-${{ matrix.label }}.dmg"

          # Notarize and staple the dmg itself as well.
          xcrun notarytool submit "insync-${{ matrix.label }}.dmg" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "insync-${{ matrix.label }}.dmg"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insync-${{ matrix.label }}
          path: insync-${{ matrix.label }}.${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: insync-${{ matrix.label }}-dmg
          path: insync-${{ matrix.label }}.dmg
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a release for tag pushes; workflow_dispatch just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
