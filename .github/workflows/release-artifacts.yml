name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            exe: ""
          - label: macos-aarch64
            os: macos-latest
            exe: ""
          - label: windows-x86_64
            os: windows-latest
            exe: ".exe"

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build
        run: cargo build --release --locked -p insync-cli

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: insync-${{ matrix.label }}
          path: rust/target/release/insync${{ matrix.exe }}
          if-no-files-found: error
