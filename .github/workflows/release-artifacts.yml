name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            exe: ""
            archive: tar.gz
          - label: macos-aarch64
            os: macos-latest
            exe: ""
            archive: tar.gz
          - label: windows-x86_64
            os: windows-latest
            exe: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tray links GTK3 and the AppIndicator library on Linux; the CLI
      # does not, so these are only needed for the tray binary.
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build
        run: cargo build --release --locked -p insync-cli -p insync-tray

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/insync${{ matrix.exe }}" dist/
          cp "target/release/insync-tray${{ matrix.exe }}" dist/
          tar -C dist -czf "insync-${{ matrix.label }}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/insync${{ matrix.exe }}" dist/
          Copy-Item "target/release/insync-tray${{ matrix.exe }}" dist/
          Compress-Archive -Path dist/* -DestinationPath "insync-${{ matrix.label }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insync-${{ matrix.label }}
          path: insync-${{ matrix.label }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a release for tag pushes; workflow_dispatch just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
